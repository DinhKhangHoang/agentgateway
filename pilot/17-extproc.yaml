# pilot-extproc — ONE ext_proc service closing the pilot's last two Kong gaps.
#
# WHAT IT CLOSES
#   Gap 1, per-tenant guardrails. Kong injects a per-tenant, per-model guardrail
#     directive list at runtime. Before this, the pilot had only a STATIC
#     per-model regex (04-model-gemini.yaml promptGuard) that every tenant on
#     that model got identically. This service fetches
#     KeyConfig.guardrails[<model>] per request and enforces it.
#   Gap 2, TPM true-up. Kong pre-debits estimated_tokens=100 at /v1/check and
#     corrects it at /v1/usage in its log phase. The pilot never corrected, so
#     every tenant was under-debited by (actual - 100) tokens on every request.
#     This service observes real usage and posts the delta.
#
# ============================================================================
# THE SSE CONSTRAINT — WHY THIS SERVICE IS SHAPED THE WAY IT IS
# ============================================================================
# agentgateway hardcodes `observability_mode = false` in 7 places
# (crates/agentgateway/src/http/ext_proc.rs) and exposes no CRD field for it, so
# the gateway ALWAYS blocks waiting for our answer to every message. There is no
# fire-and-forget mode to opt into. In FullDuplexStreamed the upstream body is
# replaced by a channel-fed StreamBody (http/ext_proc/buffering.rs:342-355), so
# EVERY response chunk round-trips gateway -> this pod -> gateway before the
# client sees it. This pod is inside the user's token stream.
#
# The processor therefore Sends each response chunk back byte-identical BEFORE
# doing anything else — no parsing, no locking, no I/O ahead of the Send — and
# never holds a chunk waiting for a later one. The usage scan runs after the
# Send, is bounded, and reuses its buffers; /v1/usage is fire-and-forget on its
# own goroutine with its own 2s timeout (matching Kong's usage_timeout_ms).
# pilot/extproc/processor_test.go's
# TestResponseBodyChunkIsForwardedWithoutWaitingForMoreChunks feeds exactly ONE
# chunk and then blocks forever in Recv; it fails on a timeout the moment
# anybody reintroduces buffering. That test was verified to FAIL against a
# deliberately buffering mutant before being trusted.
#
# Measured effect on a live stream: see pilot/verify/phase6/README.md.
#
# ============================================================================
# WHY IT RUNS FROM SOURCE INSTEAD OF A BUILT IMAGE
# ============================================================================
# Same reason as 10-adapter.yaml and 16-registry-stub.yaml: the registry
# vcr.vngcloud.vn/60108-backend-worker/portal-external/dev/ is pull-only for the
# account available here (`docker login` succeeds, `docker push` returns 401),
# so no image can be published. The committed source is mounted from a ConfigMap
# into a public golang image and run with `go run`.
#
# UNLIKE the adapter and the stub, this one is NOT stdlib-only: it needs
# github.com/envoyproxy/go-control-plane for the generated ext_proc bindings
# (its own go_package, so protoc is never run) and google.golang.org/grpc.
# GOPROXY is therefore ON here, not `off`. Module download from this namespace
# was verified before the design was committed to. A cold `go build` in
# golang:1.26-alpine from a read-only mount was MEASURED at 29s, which is what
# the readiness probe below is sized for.
#
# The ConfigMap is generated FROM the real files so the two cannot drift — same
# convention as extauthz-adapter-src and registry-stub-src, and the reason it is
# not inlined here:
#
#   kubectl -n user-11377-maas-v2-agw create configmap pilot-extproc-src \
#     --from-file=go.mod=pilot/extproc/go.mod \
#     --from-file=go.sum=pilot/extproc/go.sum \
#     --from-file=config.go=pilot/extproc/config.go \
#     --from-file=extract.go=pilot/extproc/extract.go \
#     --from-file=guardrail.go=pilot/extproc/guardrail.go \
#     --from-file=usage.go=pilot/extproc/usage.go \
#     --from-file=policy.go=pilot/extproc/policy.go \
#     --from-file=processor.go=pilot/extproc/processor.go \
#     --from-file=main.go=pilot/extproc/main.go \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# (That command is the source of truth; the ConfigMap is not checked in here.
# _test.go files are deliberately excluded — `go run .` ignores them anyway and
# they double the ConfigMap for no runtime benefit. Run them with
# `cd pilot/extproc && go test ./...`: 28 test functions, 73 cases.)
#
# NO CREDENTIAL IS IN THIS FILE. The processor reads the caller's API key from
# the in-flight Authorization header and never persists or logs it; only a
# 12-hex-character sha256 prefix ever reaches a log line.
apiVersion: v1
kind: Service
metadata:
  name: pilot-extproc
  namespace: user-11377-maas-v2-agw
  labels:
    app: pilot-extproc
spec:
  selector:
    app: pilot-extproc
  ports:
    # This is the port the AgentgatewayPolicy backendRef points at. No
    # appProtocol is set: agentgateway dials ext_proc backends as gRPC/h2c
    # unconditionally (see the upstream example
    # examples/llm-semantic-routing/k8s/agentgateway-routing.yaml, whose Service
    # also carries none).
    - name: grpc
      port: 50051
      targetPort: 50051
---
# Separate Service for probes and metrics scraping, so nothing that talks to the
# health endpoint can accidentally be routed at the gRPC port.
apiVersion: v1
kind: Service
metadata:
  name: pilot-extproc-health
  namespace: user-11377-maas-v2-agw
  labels:
    app: pilot-extproc
spec:
  selector:
    app: pilot-extproc
  ports:
    - name: http
      port: 8081
      targetPort: 8081
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pilot-extproc
  namespace: user-11377-maas-v2-agw
  labels:
    app: pilot-extproc
spec:
  # Two replicas: this pod is now on the critical path of EVERY request,
  # including the response stream, so a single-pod restart would break live
  # streams. Each ext_proc stream is independent and holds no shared state, so
  # scaling out is safe.
  replicas: 2
  selector:
    matchLabels:
      app: pilot-extproc
  template:
    metadata:
      labels:
        app: pilot-extproc
    spec:
      containers:
        - name: extproc
          image: golang:1.26-alpine
          imagePullPolicy: IfNotPresent
          workingDir: /src
          # `go run .` (package, not file) so all of the committed sources
          # compile as one main package with go.mod/go.sum honoured.
          command: ["go", "run", "."]
          env:
            - name: POLICY_SERVER_URL
              value: "http://ai-gateway-plugin-server.user-11377-maas-v2-agw.svc.cluster.local:8080"
            - name: GRPC_PORT
              value: "50051"
            - name: HEALTH_PORT
              value: "8081"
            # MUST byte-match the estimated_tokens the gateway sends to
            # /v1/check in 08-policy-extauth.yaml (100, matching Kong's
            # KongPlugin config). The true-up is delta = actual - this number;
            # a mismatch silently corrupts every tenant's TPM counter.
            - name: ESTIMATED_TOKENS
              value: "100"
            # DENY is the default in code as well; stated explicitly because it
            # is the security property this service exists to uphold. Setting
            # this to "skip" means a tenant with a presidio/llama/prompt
            # directive gets NO enforcement of it — allowed only as a
            # deliberate, logged decision, never by accident.
            - name: UNSUPPORTED_GUARDRAIL_ACTION
              value: "deny"
            # Kong uses usage_timeout_ms: 2000. Matched so the two behave the
            # same under a slow plugin server. Never blocks the response.
            - name: USAGE_TIMEOUT_MS
              value: "2000"
            - name: CHECK_TIMEOUT_MS
              value: "3000"
            # `go run` writes a build cache; the default HOME is not writable
            # for an arbitrary UID, so point both caches at the emptyDir.
            - name: GOCACHE
              value: /tmp/.cache
            - name: GOPATH
              value: /tmp/go
            # NOT `off`, unlike the adapter and the stub: this module has real
            # dependencies. go.sum is mounted alongside the sources, so every
            # download is checksum-verified.
            - name: GOPROXY
              value: "https://proxy.golang.org,direct"
            - name: GOFLAGS
              value: "-mod=mod"
          ports:
            - name: grpc
              containerPort: 50051
            - name: http
              containerPort: 8081
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8081
            # A cold `go build` here was measured at 29s in this exact image
            # from a read-only mount; module download on a cold cache adds
            # more. 30s + 5s x 40 = up to 3m30s before the pod is failed,
            # which is patient enough for a first pull without hiding a real
            # crash loop.
            initialDelaySeconds: 30
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 40
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 240
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              # The Go compiler is the memory peak here, not the server.
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: src
              mountPath: /src
            - name: gocache
              mountPath: /tmp
      volumes:
        - name: src
          configMap:
            name: pilot-extproc-src
        - name: gocache
          emptyDir: {}
---
# ============================================================================
# WIRING
# ============================================================================
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: maas-v2-agw-extproc
  namespace: user-11377-maas-v2-agw
spec:
  # Gateway-scoped, exactly like maas-v2-agw-extauth. A route-scoped policy
  # would leave any future route silently unguarded; guardrails are the wrong
  # thing to make opt-in.
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: maas-v2-agw
  traffic:
    extProc:
      backendRef:
        name: pilot-extproc
        port: 50051

      # === FAILURE MODE: FailClosed, deliberately ===
      # This processor IS the guardrail enforcement point. FailOpen would
      # forward prompts to the provider completely unguarded whenever this pod
      # is unavailable — the exact silent loss of enforcement that
      # UNSUPPORTED_GUARDRAIL_ACTION=deny exists to prevent, except worse,
      # because it happens without any directive being evaluated at all.
      #
      # It is also the consistent choice: maas-v2-agw-extauth is FailClosed, and
      # a pilot that authenticates fail-closed but guards fail-open has a
      # guardrail in name only.
      #
      # Note the CRD's own semantics make FailOpen only half-open anyway:
      # "FailOpen allows the request to continue, as long as the request body
      # has not been sent (or started streaming) to the ext_proc. Once the
      # request body has started streaming, the request will fail closed on
      # error." Since requestBodyMode is FullDuplexStreamed and every LLM
      # request has a body, FailOpen would buy availability only for the
      # narrow window before the first body byte — negligible benefit for a
      # real loss of enforcement. The cost of FailClosed is understood and
      # accepted: if pilot-extproc is down, the pilot returns errors rather
      # than unguarded answers. Hence replicas: 2.
      failureMode: FailClosed

      processingOptions:
        # Needed for the Authorization header (the API key) and the path.
        requestHeaderMode: Send
        # FullDuplexStreamed, NOT Buffered. Buffered/BufferedPartial cap at 8KB
        # (see the CRD field description), which is far too small for a real
        # prompt — a 9KB conversation would error or be silently truncated.
        requestBodyMode: FullDuplexStreamed
        # Needed to learn the content-type, i.e. whether this is SSE.
        responseHeaderMode: Send
        # THE critical one. FullDuplexStreamed is what lets each chunk be
        # forwarded the instant it arrives. Buffered would hold the entire
        # response and destroy streaming outright (and cap at 8KB besides).
        responseBodyMode: FullDuplexStreamed
        # The gateway forces trailers on for full-duplex regardless; stated
        # explicitly because the processor DEPENDS on receiving them: a
        # trailered body sends no final empty end_of_stream chunk
        # (ext_proc.rs:1232-1240), so trailers are the only end-of-stream
        # signal in that case and the processor treats them as one.
        requestTrailerMode: Send
        responseTrailerMode: Send
        # No mode_override is ever sent by this processor, and it would be
        # ignored anyway once a body mode is already FullDuplexStreamed
        # (ext_proc/processing.rs:213-219 — you can only widen, never narrow).
        # Left false so nothing can quietly renegotiate the modes above.
        allowModeOverride: false

      # NOTE ON responseAttributes: deliberately unset. CEL response attributes
      # are evaluated ONCE on the FIRST ProcessingRequest of the response phase
      # (ext_proc.rs:1343), i.e. before the body streams, so they cannot carry
      # final token counts for a stream. The usage true-up reads the terminal
      # SSE frame instead.
