# DeepSeek dual-provider canary.
#
# Two concrete Internal models wrap the same logical model at two different
# providers, and a Public virtual model splits traffic 99:1 between them.
# Internal visibility means clients cannot address the concrete models by name;
# they are reachable only through the virtual model.
#
# HOW A WEIGHTED VIRTUAL MODEL ACTUALLY RESOLVES
# ----------------------------------------------
# `resolve_virtual_model()` (crates/agentgateway/src/llm/model_router.rs) picks
# a weighted target, then uses that target's resolved NAME for two things at
# once: it rewrites the `model` field of the request body to that name, AND it
# looks the name up again with `resolve_concrete_model()`. The resolved target
# name is `spec.virtualModel.weighted.targets[].model` when set, otherwise the
# referenced CR's effective `match.model` (controller: `resolveModelTarget`).
#
# That has two consequences that shape everything below:
#
#  1. Setting `targets[].model: deepseek-v4-pro` (the real upstream name) makes
#     the router look up a CONCRETE model called `deepseek-v4-pro`. The only
#     resource with that name is this virtual model itself, and virtual models
#     live in a separate list from concrete ones, so the lookup finds nothing:
#         404 {"code":"virtual_model_target_not_found"}
#     Verified empirically. `targets[].model` is only meant for the case where
#     the referenced model uses a WILDCARD match.model, per the CRD docs.
#
#  2. Omitting `targets[].model` resolves to the alias
#     (`deepseek-v4-pro-direct`), which routes correctly but would then be sent
#     upstream as the model name - and no such model exists at DeepSeek or
#     DashScope. AgentgatewayModel has no upstream model-name override field
#     (`spec.custom` carries only `backendRef` and `formats`; the `model`
#     override lives on AgentgatewayBackend providers, not here).
#
# The fix for (2) is `policies.transformations`, which sets fields on the
# provider request body after routing: each concrete model rewrites `model`
# back to the real upstream name `deepseek-v4-pro`. Both concrete models can
# therefore keep DISTINCT routing aliases, which is what makes the 99:1 split
# observable at all - `resolve_concrete_model()` is a first-match `find()`, so
# two concrete models sharing one match.model would always select the same one
# and the weighting would be silently dead.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayModel
metadata:
  name: deepseek-v4-pro-direct
  namespace: user-11377-maas-v2-agw
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: maas-v2-agw
  match:
    model: deepseek-v4-pro-direct
  # api.deepseek.com speaks the OpenAI-compatible dialect. There is also a
  # native `Deepseek` provider enum; `OpenAI` + baseURL is used here to keep
  # the two targets configured identically, since the DashScope target below
  # has no dedicated enum value.
  provider: OpenAI
  baseURL: https://api.deepseek.com
  visibility: Internal
  policies:
    auth:
      secretRef:
        name: deepseek-direct-key
        key: key
    # Undo the routing-alias rewrite the virtual model performs, so the
    # upstream sees the real model name. The expression is CEL, hence the
    # inner quotes: it is a string literal, not a field reference.
    transformations:
      - field: model
        expression: "'deepseek-v4-pro'"
    # See the `health` block on the dashscope target below for the full
    # schema-correction and semantics notes; both arms are configured
    # identically so the canary behaves symmetrically.
    health:
      # SCHEMA CORRECTION: the plan document says `unhealthyExpression`.
      # The installed CRD field is `unhealthyCondition`; `unhealthyExpression`
      # is pruned silently by the API server, leaving the DEFAULT condition
      # (any 5xx or connection failure) in place — a policy that looks applied
      # but does not do what was written. Verified against
      # `kubectl get crd agentgatewaymodels.agentgateway.dev`.
      unhealthyCondition: 'response.code == 429 || response.code >= 500'
      eviction:
        # Base eviction window. Re-evictions back off multiplicatively
        # (duration * times_evicted). Minimum permitted by the CRD is 1s.
        duration: 30s
        # Two unhealthy responses in a row before eviction. With neither
        # consecutiveFailures nor healthThreshold set, a SINGLE unhealthy
        # response evicts.
        consecutiveFailures: 2
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayModel
metadata:
  name: deepseek-v4-pro-dashscope
  namespace: user-11377-maas-v2-agw
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: maas-v2-agw
  match:
    model: deepseek-v4-pro-dashscope
  provider: OpenAI
  baseURL: https://dashscope-intl.aliyuncs.com/compatible-mode/v1
  visibility: Internal
  policies:
    auth:
      secretRef:
        name: deepseek-dashscope-key
        key: key
    transformations:
      - field: model
        expression: "'deepseek-v4-pro'"
    # ======================================================================
    # PASSIVE HEALTH CHECKING / OUTLIER EJECTION (pilot Task 16)
    #
    # WHAT THIS DOES, AND — importantly — WHAT IT DOES NOT DO.
    #
    # `policies.health` drives ENDPOINT-level eviction inside the load
    # balancer for THIS model's backend. Each of these two arms is a single
    # hostname endpoint, and the CRD documents the fallback explicitly:
    #   "If all endpoints are evicted, the load balancer falls back to
    #    returning evicted endpoints rather than failing entirely."
    # So evicting the only endpoint of a one-endpoint backend is a no-op for
    # routing: the arm keeps being handed back.
    #
    # It also does NOT feed back into the 99:1 weighted split. That split is
    # `targets.choose_weighted(&mut rand::rng(), ...)` in
    # `resolve_virtual_model()` (crates/agentgateway/src/llm/model_router.rs)
    # — a pure weighted dice roll over model routes with no health input.
    # A sick arm therefore keeps receiving its 1% share.
    #
    # What actually rescues a request that lands on a dead arm is the RETRY
    # policy in 13-policy-resilience.yaml, because model resolution is re-run
    # per attempt — see that file.
    #
    # This block is still worth having: it is the correct primitive once an arm
    # is backed by more than one endpoint, and the health score it maintains is
    # what an eviction would be driven from.
    #
    # MEASURED: with this arm pointed at a dead host and 600 requests driven at
    # the virtual model, no eviction was ever observable — the arm kept taking
    # its ~1% share for the whole run. Every one of those requests still
    # returned 200 to the client, because the retry policy re-rolled them onto
    # the healthy arm. Deleting the retry policy and repeating the run turned
    # the same 1% straight into client-visible 503s. Full numbers are tabulated
    # in 13-policy-resilience.yaml.
    # ======================================================================
    #
    # (Duplicated verbatim from the direct arm rather than shared with a YAML
    # anchor: anchors do not survive a `---` document boundary.)
    health:
      unhealthyCondition: 'response.code == 429 || response.code >= 500'
      eviction:
        duration: 30s
        consecutiveFailures: 2
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayModel
metadata:
  name: deepseek-v4-pro
  namespace: user-11377-maas-v2-agw
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: maas-v2-agw
  match:
    model: deepseek-v4-pro
  # A virtual model must not set `provider` or `policies` (CEL rules
  # "exactly one of the fields in [provider virtualModel] must be set" and
  # "policies cannot be used with virtualModel"); auth lives on the concrete
  # targets instead. Virtual models also may not be Internal.
  visibility: Public
  virtualModel:
    weighted:
      targets:
        # No `model:` override on either target - see the header comment.
        # Each target resolves to the referenced CR's match.model, i.e. the
        # distinct routing aliases, and each concrete model transforms the
        # body back to `deepseek-v4-pro` before calling its provider.
        - modelRef:
            name: deepseek-v4-pro-direct
          weight: 99
        - modelRef:
            name: deepseek-v4-pro-dashscope
          weight: 1
