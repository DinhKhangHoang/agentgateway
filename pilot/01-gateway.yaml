apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: maas-v2-agw
  namespace: user-11377-maas-v2-agw
spec:
  gatewayClassName: agentgateway
  infrastructure:
    # VNG Cloud LB tuning, mirroring the Kong dataplane-ingress Service.
    # idle-timeout-client is the important one: LLM generations routinely run
    # for minutes, and the VNG default would sever long streaming responses.
    # Kong additionally sets enable-proxy-protocol="*"; deliberately omitted
    # here because PROXY protocol requires matching listener config on the
    # proxy side, which this Gateway does not enable.
    annotations:
      vks.vngcloud.vn/idle-timeout-client: "1200"
      vks.vngcloud.vn/idle-timeout-member: "1200"
      vks.vngcloud.vn/idle-timeout-connection: "20"
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "*.nip.io"
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: maas-v2-agw-tls
      allowedRoutes:
        namespaces:
          from: Same
        # BLOCKED — uncomment together with enabling the controller feature
        # gate (see pilot/values-controller.yaml `agentgatewayModels.enabled`).
        #
        # AgentgatewayModel is opt-in twice over: the controller must be built
        # with AGW_ENABLE_AGENTGATEWAY_MODELS=true AND the kind must be listed
        # here, or translator.GenerateSupportedKinds drops it. Applying this
        # block while the gate is off leaves the listener stuck on
        # `ResolvedRefs=False / InvalidRouteKinds`, because listing any kinds
        # switches the listener to an intersection filter and the unsupported
        # entry can never be satisfied. Verified empirically 2026-07-25.
        #
        # Note HTTPRoute must be relisted alongside it: the intersection filter
        # would otherwise drop the legacy compatibility routes.
        #
        # kinds:
        #   - group: gateway.networking.k8s.io
        #     kind: HTTPRoute
        #   - group: agentgateway.dev
        #     kind: AgentgatewayModel
